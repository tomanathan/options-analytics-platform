name: oap
version: "0.1.0"
config-version: 2
profile: oap
require-dbt-version: [">=1.10.0", "<2.0.0"]

flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  oap:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  oap:
    watchlist:
      +column_types:
        symbol: varchar
        sector: varchar
        added_on: date
