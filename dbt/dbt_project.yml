name: oap
version: "0.1.0"
config-version: 2
profile: oap
require-dbt-version: [">=1.10.0", "<2.0.0"]

flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"
clean-targets:
  - target
  - dbt_packages

# Bronze views are registered once per invocation, pinned to one Iceberg snapshot (ADR 0008).
on-run-start:
  - "{{ register_bronze() }}"

models:
  oap:
    staging:
      +materialized: view
      +schema: silver
    intermediate:
      +materialized: view
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
    # Python models over the pure oap.analytics package. dbt-duckdb runs them in process; Snowflake stays
    # compile-only until Phase 4 ships them as Snowpark Python models, so they are disabled off DuckDB.
    analytics:
      +schema: gold
      +materialized: table
      +tags: ["analytics"]
      +enabled: "{{ target.type == 'duckdb' }}"

seeds:
  oap:
    watchlist:
      +column_types:
        symbol: varchar
        sector: varchar
        added_on: date
