version: 2

seeds:
  - name: watchlist
    description: >
      Underlyings the platform tracks. One row per US-listed symbol with liquid listed
      options; ingestion pulls daily chains only for these symbols.
    columns:
      - name: symbol
        description: Ticker of the underlying as listed on its US exchange.
        data_tests:
          - unique
          - not_null
      - name: sector
        description: GICS sector of the underlying, or "Broad Market ETF" for index ETFs.
      - name: added_on
        description: Date the symbol was added to the watchlist.
