[project]
name = "oap"
version = "0.1.0"
description = "Options analytics platform: options chains to Iceberg, dbt on Snowflake, and a put credit spread engine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aman Vishwanathan" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "great-expectations~=1.23",
    "httpx>=0.28,<1",
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "pandas-market-calendars>=5.5,<6",
    "pandera>=0.34,<1",
    "pyarrow>=25,<26",
    "pyiceberg[glue,pyarrow,pyiceberg-core]~=0.12.0",
    "tenacity>=9.1,<10",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "hypothesis==6.168.5",
    "pre-commit==4.6.2",
    "detect-secrets==1.5.0",
    "pyyaml>=6,<7",
    "types-pyyaml>=6,<7",
    "pandas-stubs>=2.2,<3",
    "pyarrow-stubs>=20,<21",
]
airflow = ["apache-airflow==2.11.2"]
dbt = [
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.11,<2",
    "dbt-snowflake>=1.12,<2",
    # dbt Python models import oap.analytics.
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
]
report = ["matplotlib>=3.10,<4"]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    # Same DuckDB as the dbt writer (uv.lock and docker/requirements-dbt.txt); the file format must match.
    "duckdb==1.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oap"]

[tool.uv]
default-groups = ["dev", "airflow", "dbt", "report", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/dbt_packages", "dbt/target", "apps/web/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["oap", "dags"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["src", "tests", "dags", "plugins", "scripts"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# pandas_market_calendars ships no type information.
module = ["pandas_market_calendars", "pandas_market_calendars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    # pandas_market_calendars builds Timedeltas with a deprecated numpy unit; not our code.
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
]
