name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to major versions rather than SHAs: readability over supply-chain hardening for a portfolio repo.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned so `uv export` prints the same text as locally and `make lock-check` cannot drift.
          version: "0.12.23"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - run: make check
        env:
          HYPOTHESIS_PROFILE: ci
      - run: uv run pre-commit run --all-files

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: make tf-fmt
      - run: make tf-validate
      - run: make compose-config
      - run: docker compose --profile tools build dbt
      - run: make airflow-build
